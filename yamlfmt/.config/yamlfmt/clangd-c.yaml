CompileFlags:
  Remove:
    - "-std=*"
  Add:
    - "-std=c23"
    - "-Wall"
    - "-Wextra"
    - "-Wpedantic"
    - "-Wconversion"
    - "-Wsign-conversion"
    - "-Wshadow"
    - "-Wformat=2"
    - "-Wundef"
    - "-Wstrict-prototypes"
    - "-Wmissing-prototypes"

Diagnostics:
  UnusedIncludes: Strict
  MissingIncludes: Strict
